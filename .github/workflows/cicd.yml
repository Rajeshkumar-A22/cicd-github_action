name: Maven Build and Docker Push
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Java Version
        run: java -version
      - name: Check Maven Version
        run: mvn -version
      - name: Maven compile
        run: mvn compile
      - name: Maven Test
        run: mvn test
      - name: Maven Package
        run: mvn package -DskipTests
      - name: Check JAR File
        run: ls -lh target/